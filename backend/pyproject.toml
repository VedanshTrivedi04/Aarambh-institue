[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aarambh-erp-backend"
version = "0.1.0"
description = "Aarambh Institute ERP — FastAPI Backend"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "gunicorn>=22.0.0",

    # Database — async SQLAlchemy + asyncpg driver
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",

    # Migrations
    "alembic>=1.13.0",

    # Data validation & config
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.0.0",

    # Auth — modern password hashing (Argon2, recommended by FastAPI docs)
    "pwdlib[argon2]>=0.2.0",

    # Auth — JWT
    "pyjwt[crypto]>=2.8.0",

    # Background tasks
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",

    # HTTP client (for health checks and internal use)
    "httpx>=0.27.0",

    # File uploads & S3-compatible storage
    "boto3>=1.34.0",
    "python-multipart>=0.0.9",

    # PDF receipt generation
    "reportlab>=4.2.0",

    # Utilities
    "python-slugify>=8.0.0",
    "orjson>=3.10.0",

    # Payments
    "razorpay>=1.4.2",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",

    # Code quality
    "ruff>=0.4.0",
    "black>=24.4.0",
    "isort>=5.13.0",
    "mypy>=1.10.0",

    # Type stubs
    "types-redis>=4.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# ---------------------------------------------------------------------------
# Ruff (linter)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]
ignore = ["B008"]  # function calls in default args (FastAPI Depends pattern)

# ---------------------------------------------------------------------------
# Black (formatter)
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]

# ---------------------------------------------------------------------------
# isort (import sorting)
# ---------------------------------------------------------------------------
[tool.isort]
profile = "black"
line_length = 100

# ---------------------------------------------------------------------------
# mypy (type checking)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

addopts = "--cov=app --cov-report=term-missing --cov-fail-under=70"

