# =============================================================================
# Aarambh Institute ERP — Render Blueprint (render.yaml)
#
# Backend Service Only (Database is hosted on Neon PostgreSQL)
# Documentation: https://render.com/docs/blueprint-spec
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # FastAPI ASGI Backend Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: aarambh-erp-backend
    env: python
    region: oregon            # Options: oregon, frankfurt, singapore, ohio
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: alembic upgrade head && gunicorn -w 2 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:$PORT --timeout 120 app.main:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # --- Application Core ---
      - key: APP_ENV
        value: prod
      - key: DEBUG
        value: "false"
      - key: APP_NAME
        value: "Aarambh Institute ERP"
      - key: APP_VERSION
        value: "0.1.0"
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: WEB_CONCURRENCY
        value: "2"

      # --- Security & JWT ---
      # Secrets live in the Render dashboard only — this file is in a public repo.
      # Generate with: openssl rand -hex 32
      - key: SECRET_KEY
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"

      # --- Neon PostgreSQL Database URL ---
      # Set in the Render dashboard (Neon connection string) — never commit it.
      - key: DATABASE_URL
        sync: false

      # --- CORS: browsers reach the API through the frontend's same-origin /api/v1
      # proxy, so only list origins that must call the backend directly. No wildcard
      # (*.vercel.app) — with credentials enabled it would trust any site on Vercel.
      - key: CORS_ORIGINS
        value: '["http://localhost:3000","http://127.0.0.1:3000","https://aarambh-institute.vercel.app"]'

      # --- Reverse proxy: Render's load balancer appends the client IP to
      # X-Forwarded-For. Needed so login rate limiting keys on the real client IP.
      - key: TRUSTED_PROXY_COUNT
        value: "1"

      # --- File Storage & Rate Limiting ---
      - key: STORAGE_BACKEND
        value: local
      - key: LOCAL_STORAGE_PATH
        value: ./uploads
      - key: RATE_LIMIT_AUTH_RPM
        value: "60"

      # --- Razorpay (Optional: set in Render Dashboard if used) ---
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
