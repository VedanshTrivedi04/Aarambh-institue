# =============================================================================
# Aarambh Institute ERP — Render Blueprint (render.yaml)
#
# Backend Service Only (Database is hosted on Neon PostgreSQL)
# Documentation: https://render.com/docs/blueprint-spec
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # FastAPI ASGI Backend Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: aarambh-erp-backend
    env: python
    region: oregon            # Options: oregon, frankfurt, singapore, ohio
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # --- Application Core ---
      - key: APP_ENV
        value: prod
      - key: DEBUG
        value: "false"
      - key: APP_NAME
        value: "Aarambh Institute ERP"
      - key: APP_VERSION
        value: "0.1.0"
      - key: PYTHON_VERSION
        value: 3.11.9

      # --- Security & JWT ---
      - key: SECRET_KEY
        value: 9f8c4e5b6a7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"

      # --- Neon PostgreSQL Database URL ---
      - key: DATABASE_URL
        value: postgresql+asyncpg://neondb_owner:npg_AMiL8sNJE7tZ@ep-damp-fog-akngnd30.c-3.us-west-2.aws.neon.tech/neondb?ssl=require

      # --- CORS: Allows Vercel frontend and local development ---
      - key: CORS_ORIGINS
        value: "http://localhost:3000,http://127.0.0.1:3000,https://aarambh-institute.vercel.app"
      - key: CORS_ORIGIN_REGEX
        value: "https://.*\\.vercel\\.app"

      # --- File Storage & Rate Limiting ---
      - key: STORAGE_BACKEND
        value: local
      - key: LOCAL_STORAGE_PATH
        value: ./uploads
      - key: RATE_LIMIT_AUTH_RPM
        value: "60"

      # --- Razorpay (Optional: set in Render Dashboard if used) ---
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
